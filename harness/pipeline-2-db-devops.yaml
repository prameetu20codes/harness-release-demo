# =============================================================================
# PIPELINE 2 of 4 — DB DevOps: preview + apply Liquibase changes to ONE env
# Reusable: the release flow calls it once per environment (dev, qa, prod).
#
# Needs (Phase 3):
#   - DB Schema   `product_catalog_schema` -> repo harness-release-demo,
#                 path db/changelog/db.changelog-master.yaml (connector harnesstesting)
#   - DB Instances `dev`, `qa`, `prod` under that schema (one JDBC connector each)
#   - K8S_CONNECTOR + namespace where DB DevOps step containers run
#     (the namespace your delegate is installed in is the simplest choice)
# =============================================================================
pipeline:
  name: 2 - DB Schema Rollout
  identifier: db_schema_rollout
  projectIdentifier: testproj
  orgIdentifier: testprameet
  tags:
    module: dbops
  variables:
    - name: target_env
      type: String
      description: Database instance to migrate
      required: true
      value: <+input>.allowedValues(dev,qa,prod)
  stages:
    - stage:
        name: Migrate Schema
        identifier: migrate_schema
        type: Custom
        spec:
          execution:
            steps:
              - stepGroup:
                  name: Liquibase
                  identifier: liquibase
                  stepGroupInfra:
                    type: KubernetesDirect
                    spec:
                      connectorRef: K8S_CONNECTOR
                      namespace: harness-delegate-ng
                  steps:
                    - step:
                        type: LiquibaseCommand
                        name: Preview SQL
                        identifier: preview_sql
                        spec:
                          connectorRef: account.harnessImage
                          dbSchema: product_catalog_schema
                          dbInstance: <+pipeline.variables.target_env>
                          command: updateSQL
                        timeout: 10m
                    - step:
                        type: DBSchemaApply
                        name: Apply Schema
                        identifier: apply_schema
                        spec:
                          connectorRef: account.harnessImage
                          dbSchema: product_catalog_schema
                          dbInstance: <+pipeline.variables.target_env>
                          tag: release-<+pipeline.sequenceId>
                        timeout: 10m
            rollbackSteps:
              - stepGroup:
                  name: Liquibase Rollback
                  identifier: liquibase_rollback
                  stepGroupInfra:
                    type: KubernetesDirect
                    spec:
                      connectorRef: K8S_CONNECTOR
                      namespace: harness-delegate-ng
                  steps:
                    - step:
                        type: DBSchemaRollback
                        name: Rollback Schema
                        identifier: rollback_schema
                        spec:
                          connectorRef: account.harnessImage
                          dbSchema: product_catalog_schema
                          dbInstance: <+pipeline.variables.target_env>
                          tag: release-<+pipeline.sequenceId>
                        timeout: 10m
        failureStrategies:
          - onFailure:
              errors:
                - AllErrors
              action:
                type: StageRollback
