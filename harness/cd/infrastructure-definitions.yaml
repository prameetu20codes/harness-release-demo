# Three infrastructure definitions inside environment releasedevqa. Their
# identifiers must stay dev / qa / prod: the CD pipeline selects them from
# target_env and the service picks values-<+infra.infraIdentifier>.yaml.
# Replace K8S_CONNECTOR with your Kubernetes connector identifier.
infrastructureDefinition:
  name: dev
  identifier: dev
  orgIdentifier: testprameet
  projectIdentifier: testproj
  environmentRef: releasedevqa
  deploymentType: Kubernetes
  type: KubernetesDirect
  spec:
    connectorRef: K8S_CONNECTOR
    namespace: catalog-dev
    releaseName: product-catalog
  allowSimultaneousDeployments: false
---
infrastructureDefinition:
  name: qa
  identifier: qa
  orgIdentifier: testprameet
  projectIdentifier: testproj
  environmentRef: releasedevqa
  deploymentType: Kubernetes
  type: KubernetesDirect
  spec:
    connectorRef: K8S_CONNECTOR
    namespace: catalog-qa
    releaseName: product-catalog
  allowSimultaneousDeployments: false
---
infrastructureDefinition:
  name: prod
  identifier: prod
  orgIdentifier: testprameet
  projectIdentifier: testproj
  environmentRef: releasedevqa
  deploymentType: Kubernetes
  type: KubernetesDirect
  spec:
    connectorRef: K8S_CONNECTOR
    namespace: catalog-prod
    releaseName: product-catalog
  allowSimultaneousDeployments: false
