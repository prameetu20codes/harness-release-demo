# =============================================================================
# PIPELINE 1 of 4 — CI: Test -> Build & Push -> Image Scan -> SBOM
# Live in Harness: org testprameet / project testproj. Runs on Harness Cloud.
# =============================================================================
pipeline:
  name: 1 - CI Build and Push
  identifier: ci_build_and_push
  projectIdentifier: testproj
  orgIdentifier: testprameet
  tags:
    module: ci
  variables:
    - name: release_version
      type: String
      description: Extra image tag for release builds (e.g. 1.0.0); non-release builds push "snapshot"
      required: false
      value: <+input>.default(snapshot)
  properties:
    ci:
      codebase:
        connectorRef: harnesstesting
        repoName: harness-release-demo
        build: <+input>
        sparseCheckout: []
  stages:
    - stage:
        name: Build and Push
        identifier: build_and_push
        type: CI
        spec:
          cloneCodebase: true
          caching:
            enabled: false
            paths: []
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Cloud
            spec: {}
          execution:
            steps:
              - step:
                  type: Run
                  name: Unit Tests
                  identifier: unit_tests
                  spec:
                    connectorRef: assa
                    image: maven:3.9-eclipse-temurin-17
                    shell: Sh
                    command: |-
                      cd app
                      mvn -B test
                    reports:
                      type: JUnit
                      spec:
                        paths:
                          - app/target/surefire-reports/*.xml
              - step:
                  type: BuildAndPushDockerRegistry
                  name: Build and Push Image
                  identifier: build_and_push_image
                  spec:
                    connectorRef: ffdockerconnector
                    repo: prameet2025/release-app
                    tags:
                      - <+pipeline.sequenceId>
                      - <+codebase.shortCommitSha>
                      - <+pipeline.variables.release_version>
                    caching: true
                    dockerfile: app/Dockerfile
                    context: app
                    buildArgs:
                      APP_VERSION: <+pipeline.sequenceId>
              - parallel:
                  - step:
                      type: AquaTrivy
                      name: Trivy Image Scan
                      identifier: trivy_image_scan
                      spec:
                        mode: orchestration
                        config: default
                        target:
                          type: container
                          detection: auto
                        advanced:
                          log:
                            level: info
                          fail_on_severity: none
                        privileged: true
                        image:
                          type: docker_v2
                          tag: <+pipeline.sequenceId>
                          access_id: prameet2025
                          access_token: <+secrets.getValue("docker-pat-new")>
                          name: prameet2025/release-app
                        sbom:
                          format: spdx-json
                  - step:
                      type: SscaOrchestration
                      name: Generate SBOM
                      identifier: generate_sbom
                      spec:
                        mode: generation
                        tool:
                          type: Syft
                          spec:
                            format: spdx-json
                        source:
                          type: docker
                          spec:
                            connector: ffdockerconnector
                            image: prameet2025/release-app:<+pipeline.sequenceId>
                        resources:
                          limits:
                            memory: 500Mi
                            cpu: "0.5"
          buildIntelligence:
            enabled: false
        description: ""
