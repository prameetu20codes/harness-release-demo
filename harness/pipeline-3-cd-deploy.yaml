pipeline:
  name: 3 - CD Deploy
  identifier: cd_deploy
  projectIdentifier: testproj
  orgIdentifier: testprameet
  tags:
    module: cd
  variables:
    - name: target_env
      type: String
      description: Environment to deploy to
      required: true
      value: <+input>.allowedValues(dev,qa,prod)
    - name: image_tag
      type: String
      description: Build number produced by 1 - CI Build and Push
      required: true
      value: <+input>
  stages:
    - stage:
        name: Deploy Rolling
        identifier: deploy_rolling
        description: Rolling deployment for dev and qa
        type: Deployment
        when:
          pipelineStatus: Success
          condition: <+pipeline.variables.target_env> != "prod"
        spec:
          deploymentType: Kubernetes
          service:
            serviceRef: product_catalog
            serviceInputs:
              serviceDefinition:
                type: Kubernetes
                spec:
                  artifacts:
                    primary:
                      sources:
                        - identifier: dockerhub
                          type: DockerRegistry
                          spec:
                            tag: <+pipeline.variables.image_tag>
          environment:
            environmentRef: releasedevqa
            deployToAll: false
            infrastructureDefinitions:
              - identifier: <+pipeline.variables.target_env>
          execution:
            steps:
              - step:
                  type: K8sRollingDeploy
                  name: Rolling Deploy
                  identifier: rolling_deploy
                  spec:
                    skipDryRun: false
                    pruningEnabled: false
                  timeout: 10m
            rollbackSteps:
              - step:
                  type: K8sRollingRollback
                  name: Rolling Rollback
                  identifier: rolling_rollback
                  spec:
                    pruningEnabled: false
                  timeout: 10m
        failureStrategies:
          - onFailure:
              errors:
                - AllErrors
              action:
                type: StageRollback
    - stage:
        name: Deploy Canary
        identifier: deploy_canary
        description: Canary deployment for prod
        type: Deployment
        when:
          pipelineStatus: Success
          condition: <+pipeline.variables.target_env> == "prod"
        spec:
          deploymentType: Kubernetes
          service:
            serviceRef: product_catalog
            serviceInputs:
              serviceDefinition:
                type: Kubernetes
                spec:
                  artifacts:
                    primary:
                      sources:
                        - identifier: dockerhub
                          type: DockerRegistry
                          spec:
                            tag: <+pipeline.variables.image_tag>
          environment:
            environmentRef: releasedevqa
            deployToAll: false
            infrastructureDefinitions:
              - identifier: <+pipeline.variables.target_env>
          execution:
            steps:
              - stepGroup:
                  name: Canary
                  identifier: canary
                  steps:
                    - step:
                        type: K8sCanaryDeploy
                        name: Canary Deploy
                        identifier: canary_deploy
                        spec:
                          instanceSelection:
                            type: Count
                            spec:
                              count: 1
                          skipDryRun: false
                        timeout: 10m
                    - step:
                        type: HarnessApproval
                        name: HarnessApproval_1
                        identifier: HarnessApproval_1
                        spec:
                          approvalMessage: Please review the following information and approve the pipeline progression
                          includePipelineExecutionHistory: true
                          isAutoRejectEnabled: false
                          approvers:
                            userGroups:
                              - prameetrg
                            minimumCount: 1
                            disallowPipelineExecutor: false
                          approverInputs: []
                        timeout: 1d
                    - step:
                        type: K8sCanaryDelete
                        name: Canary Delete
                        identifier: canary_delete
                        spec: {}
                        timeout: 10m
              - stepGroup:
                  name: Primary
                  identifier: primary
                  steps:
                    - step:
                        type: K8sRollingDeploy
                        name: Full Rollout
                        identifier: full_rollout
                        spec:
                          skipDryRun: false
                          pruningEnabled: false
                        timeout: 15m
            rollbackSteps:
              - step:
                  type: K8sCanaryDelete
                  name: Canary Delete
                  identifier: rollback_canary_delete
                  spec: {}
                  timeout: 10m
              - step:
                  type: K8sRollingRollback
                  name: Rolling Rollback
                  identifier: rolling_rollback
                  spec:
                    pruningEnabled: false
                  timeout: 10m
        failureStrategies:
          - onFailure:
              errors:
                - AllErrors
              action:
                type: StageRollback
