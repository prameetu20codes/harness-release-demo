# =============================================================================
# PIPELINE 3 of 4 — CD: deploy ONE build to ONE environment
# Reusable: the release flow calls it per environment.
#   dev / qa -> "Deploy Rolling" stage runs
#   prod     -> "Deploy Canary" stage runs (1 canary pod -> health gate -> full rollout)
#
# Needs (Phase 4): service product_catalog, environments dev/qa/prod, and an
# infrastructure definition with identifier `k8s` inside EACH environment
# (definitions live in harness/cd/). Smoke tests run on the in-cluster delegate.
# =============================================================================
pipeline:
  name: 3 - CD Deploy
  identifier: cd_deploy
  projectIdentifier: testproj
  orgIdentifier: testprameet
  tags:
    module: cd
  variables:
    - name: target_env
      type: String
      description: Environment to deploy to
      required: true
      value: <+input>.allowedValues(dev,qa,prod)
    - name: image_tag
      type: String
      description: Build number produced by 1 - CI Build and Push
      required: true
      value: <+input>
  stages:
    - stage:
        name: Deploy Rolling
        identifier: deploy_rolling
        description: Rolling deployment for dev and qa
        type: Deployment
        when:
          pipelineStatus: Success
          condition: <+pipeline.variables.target_env> != "prod"
        spec:
          deploymentType: Kubernetes
          service:
            serviceRef: product_catalog
            serviceInputs:
              serviceDefinition:
                type: Kubernetes
                spec:
                  artifacts:
                    primary:
                      sources:
                        - identifier: dockerhub
                          type: DockerRegistry
                          spec:
                            tag: <+pipeline.variables.image_tag>
          environment:
            environmentRef: releasedevqa
            deployToAll: false
            infrastructureDefinitions:
              - identifier: <+pipeline.variables.target_env>
          execution:
            steps:
              - step:
                  type: K8sRollingDeploy
                  name: Rolling Deploy
                  identifier: rolling_deploy
                  spec:
                    skipDryRun: false
                    pruningEnabled: false
                  timeout: 10m
              - step:
                  type: ShellScript
                  name: Smoke Test
                  identifier: smoke_test
                  spec:
                    shell: Bash
                    onDelegate: true
                    executionTarget: {}
                    source:
                      type: Inline
                      spec:
                        script: |-
                          BASE="http://product-catalog.<+infra.namespace>.svc.cluster.local"
                          EXPECTED="<+pipeline.variables.image_tag>"
                          for i in $(seq 1 12); do
                            BODY=$(curl -fsS "$BASE/version" || true)
                            if echo "$BODY" | grep -q "\"version\":\"$EXPECTED\""; then
                              echo "Live: $BODY"
                              curl -fsS "$BASE/api/products" && echo
                              exit 0
                            fi
                            echo "Attempt $i: got '$BODY', retrying in 5s"
                            sleep 5
                          done
                          echo "Version $EXPECTED never became live"
                          exit 1
                    environmentVariables: []
                    outputVariables: []
                  timeout: 5m
            rollbackSteps:
              - step:
                  type: K8sRollingRollback
                  name: Rolling Rollback
                  identifier: rolling_rollback
                  spec:
                    pruningEnabled: false
                  timeout: 10m
        failureStrategies:
          - onFailure:
              errors:
                - AllErrors
              action:
                type: StageRollback
    - stage:
        name: Deploy Canary
        identifier: deploy_canary
        description: Canary deployment for prod
        type: Deployment
        when:
          pipelineStatus: Success
          condition: <+pipeline.variables.target_env> == "prod"
        spec:
          deploymentType: Kubernetes
          service:
            serviceRef: product_catalog
            serviceInputs:
              serviceDefinition:
                type: Kubernetes
                spec:
                  artifacts:
                    primary:
                      sources:
                        - identifier: dockerhub
                          type: DockerRegistry
                          spec:
                            tag: <+pipeline.variables.image_tag>
          environment:
            environmentRef: releasedevqa
            deployToAll: false
            infrastructureDefinitions:
              - identifier: <+pipeline.variables.target_env>
          execution:
            steps:
              - stepGroup:
                  name: Canary
                  identifier: canary
                  steps:
                    - step:
                        type: K8sCanaryDeploy
                        name: Canary Deploy
                        identifier: canary_deploy
                        spec:
                          instanceSelection:
                            type: Count
                            spec:
                              count: 1
                          skipDryRun: false
                        timeout: 10m
                    - step:
                        type: ShellScript
                        name: Canary Health Gate
                        identifier: canary_health_gate
                        spec:
                          shell: Bash
                          onDelegate: true
                          executionTarget: {}
                          source:
                            type: Inline
                            spec:
                              script: |-
                                URL="http://product-catalog.<+infra.namespace>.svc.cluster.local/actuator/health/readiness"
                                for i in $(seq 1 24); do
                                  if ! curl -fsS "$URL" > /dev/null; then
                                    echo "Health check failed on attempt $i"
                                    exit 1
                                  fi
                                  sleep 5
                                done
                                echo "Canary healthy for 2 minutes"
                          environmentVariables: []
                          outputVariables: []
                        timeout: 5m
                    - step:
                        type: K8sCanaryDelete
                        name: Canary Delete
                        identifier: canary_delete
                        spec: {}
                        timeout: 10m
              - stepGroup:
                  name: Primary
                  identifier: primary
                  steps:
                    - step:
                        type: K8sRollingDeploy
                        name: Full Rollout
                        identifier: full_rollout
                        spec:
                          skipDryRun: false
                          pruningEnabled: false
                        timeout: 15m
                    - step:
                        type: ShellScript
                        name: Smoke Test
                        identifier: smoke_test
                        spec:
                          shell: Bash
                          onDelegate: true
                          executionTarget: {}
                          source:
                            type: Inline
                            spec:
                              script: |-
                                BASE="http://product-catalog.<+infra.namespace>.svc.cluster.local"
                                EXPECTED="<+pipeline.variables.image_tag>"
                                for i in $(seq 1 12); do
                                  BODY=$(curl -fsS "$BASE/version" || true)
                                  if echo "$BODY" | grep -q "\"version\":\"$EXPECTED\""; then
                                    echo "Live: $BODY"
                                    exit 0
                                  fi
                                  echo "Attempt $i: got '$BODY', retrying in 5s"
                                  sleep 5
                                done
                                echo "Version $EXPECTED never became live"
                                exit 1
                          environmentVariables: []
                          outputVariables: []
                        timeout: 5m
            rollbackSteps:
              - step:
                  type: K8sCanaryDelete
                  name: Canary Delete
                  identifier: rollback_canary_delete
                  spec: {}
                  timeout: 10m
              - step:
                  type: K8sRollingRollback
                  name: Rolling Rollback
                  identifier: rolling_rollback
                  spec:
                    pruningEnabled: false
                  timeout: 10m
        failureStrategies:
          - onFailure:
              errors:
                - AllErrors
              action:
                type: StageRollback
