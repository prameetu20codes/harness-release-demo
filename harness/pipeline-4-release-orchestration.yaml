# =============================================================================
# PIPELINE 4 of 4 — Release Train (chained pipelines)
# One click runs the whole release: build once, migrate the dev DB and deploy
# dev, then a go/no-go approval before the QA DB migration and QA deploy.
# The same three child pipelines are also what you plug into Harness Release
# Orchestration as activities (Phase 5).
#
# Needs: user group `release_managers`; secret `slack_release_webhook` before
# you flip the notification rule to enabled.
# =============================================================================
pipeline:
  name: 4 - Release Train
  identifier: release_train
  projectIdentifier: testproj
  orgIdentifier: testprameet
  tags:
    module: release
  variables:
    - name: release_branch
      type: String
      description: Branch to build and release
      required: true
      value: <+input>.default(main)
  stages:
    - stage:
        name: Build
        identifier: build
        type: Pipeline
        spec:
          org: testprameet
          project: testproj
          pipeline: ci_build_and_push
          inputs:
            identifier: ci_build_and_push
            properties:
              ci:
                codebase:
                  build:
                    type: branch
                    spec:
                      branch: <+pipeline.variables.release_branch>
          outputs:
            - name: image_tag
              value: <+pipeline.sequenceId>
    - stage:
        name: DB Migrate Dev
        identifier: db_dev
        type: Pipeline
        spec:
          org: testprameet
          project: testproj
          pipeline: db_schema_rollout
          inputs:
            identifier: db_schema_rollout
            variables:
              - name: target_env
                type: String
                value: dev
    - stage:
        name: Deploy Dev
        identifier: deploy_dev
        type: Pipeline
        spec:
          org: testprameet
          project: testproj
          pipeline: cd_deploy
          inputs:
            identifier: cd_deploy
            variables:
              - name: target_env
                type: String
                value: dev
              - name: image_tag
                type: String
                value: <+pipeline.stages.build.output.image_tag>
    - stage:
        name: QA Go No-Go
        identifier: qa_approval
        type: Approval
        spec:
          execution:
            steps:
              - step:
                  type: HarnessApproval
                  name: Release Manager Approval
                  identifier: release_manager_approval
                  timeout: 1d
                  spec:
                    approvalMessage: |-
                      Promote product-catalog build <+pipeline.stages.build.output.image_tag> to QA?
                      The dev schema migration and dev deployment have passed.
                    includePipelineExecutionHistory: true
                    isAutoRejectEnabled: false
                    approvers:
                      userGroups:
                        - release_managers
                      minimumCount: 1
                      disallowPipelineExecutor: false
                    approverInputs: []
    - stage:
        name: DB Migrate QA
        identifier: db_qa
        type: Pipeline
        spec:
          org: testprameet
          project: testproj
          pipeline: db_schema_rollout
          inputs:
            identifier: db_schema_rollout
            variables:
              - name: target_env
                type: String
                value: qa
    - stage:
        name: Deploy QA
        identifier: deploy_qa
        type: Pipeline
        spec:
          org: testprameet
          project: testproj
          pipeline: cd_deploy
          inputs:
            identifier: cd_deploy
            variables:
              - name: target_env
                type: String
                value: qa
              - name: image_tag
                type: String
                value: <+pipeline.stages.build.output.image_tag>
  notificationRules:
    - name: Release Slack
      identifier: release_slack
      pipelineEvents:
        - type: PipelineStart
        - type: PipelineSuccess
        - type: PipelineFailed
        - type: StageFailed
      notificationMethod:
        type: Slack
        spec:
          userGroups: []
          webhookUrl: <+secrets.getValue("slack_release_webhook")>
      enabled: false
