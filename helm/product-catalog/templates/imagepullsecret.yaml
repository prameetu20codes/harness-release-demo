{{- if .Values.dockercfg }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "product-catalog.fullname" . }}-dockercfg
  labels:
    {{- include "product-catalog.labels" . | nindent 4 }}
  annotations:
    harness.io/skip-versioning: "true"
type: kubernetes.io/dockercfg
data:
  .dockercfg: {{ .Values.dockercfg }}
{{- end }}
