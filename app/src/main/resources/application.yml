spring:
  application:
    name: product-catalog
  # Schema is owned and migrated by Harness DB DevOps (Liquibase), NOT by the app.
  # The app only reads/writes data — it never mutates schema. This is the key
  # separation-of-concerns the demo showcases.
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  liquibase:
    enabled: false
  datasource:
    url: ${DB_URL:jdbc:h2:mem:catalog;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}

app:
  build:
    version: ${APP_VERSION:dev}
  environment: ${APP_ENVIRONMENT:local}

# Actuator drives Kubernetes liveness/readiness probes and Harness verification.
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true

server:
  port: 8080
  shutdown: graceful
