# Master changelog consumed by Harness DB DevOps.
# Explicit includes keep the apply order reviewable in every PR. Applied
# changesets are immutable: never edit one, always add a new file.
databaseChangeLog:
  - include:
      file: changes/001-create-products-table.yaml
      relativeToChangelogFile: true
  - include:
      file: changes/002-seed-products.yaml
      relativeToChangelogFile: true
  # Release demo: uncomment and push to ship a schema change through dev -> qa -> prod.
  # - include:
  #     file: changes/003-add-sku-unique-index.yaml
  #     relativeToChangelogFile: true
