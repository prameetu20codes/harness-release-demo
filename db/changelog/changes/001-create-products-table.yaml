databaseChangeLog:
  - changeSet:
      id: "001-create-products-table"
      author: prameet
      comment: "Create products table"
      changes:
        - createTable:
            tableName: products
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: sku
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: category
                  type: VARCHAR(128)
              - column:
                  name: price
                  type: NUMERIC(12, 2)
                  constraints:
                    nullable: false
      rollback:
        - dropTable:
            tableName: products
